[project]
name = "finch-lite-benchmarks"
description = "Benchmarks for finch-tensor"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "finch-tensor",
    "numpy",
    "scipy",
    "sparse",
    "matplotlib (>=3.10.9,<4.0.0)",
    "gdown>=5.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.4",
    "pytest-cov",
]

[build-system]
requires = ["uv_build>=0.11.25"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "finchtensorbench"
module-root = "src"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
requires-pixi = ">=0.71.0"

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
numpy = "*"
matplotlib = ">=3.10.9,<4"
scipy = "*"
sparse = "*"
pyinstrument = ">=5.1.3,<6"
py-spy = ">=0.4.2,<0.5"

[tool.pixi.pypi-dependencies]
finch-tensor = { git = "https://github.com/finch-tensor/finch-tensor-lite.git", branch = "main", extras = ["julia"] }
ssgetpy = ">=1.0rc2"
gdown = ">=5.2"

[tool.pixi.feature.test.dependencies]
pytest = ">=7.4.4"
pytest-cov = "*"

[tool.pixi.environments]
test = { features = ["test"] }

[tool.pixi.activation.env]
PYTHONPATH = "src"

[tool.pixi.tasks]
uniform-stats = "python -m finchtensorbench.benchmarks.uniform_stats"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["slow: runs Finch (starts Julia)"]
