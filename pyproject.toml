[project]
name = "finch-lite-benchmarks"
description = "Benchmarks for finch-tensor-lite"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "finch-tensor-lite>=0.4.0",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.4",
    "pytest-cov",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false